name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: brazap.exe
            asset: brazap-windows-x86_64.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: brazap
            asset: brazap-linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            binary: brazap
            asset: brazap-macos-aarch64
          - os: macos-15
            target: x86_64-apple-darwin
            binary: brazap
            asset: brazap-macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up MSVC resource compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Select the Visual Studio linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $linker)) { throw "MSVC linker not found: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libclang-dev libasound2-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup override set 1.99.1
          rustup target add '${{ matrix.target }}'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Check version and formatting
        shell: bash
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$BUILD_REF_TYPE" == tag ]]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            [[ "$BUILD_REF" == "v$version" ]] || { echo 'Tag must match Cargo.toml version'; exit 1; }
          fi
          ./scripts/cargo fmt --all -- --check
      - name: Build
        shell: bash
        run: ./scripts/cargo build --locked --release --features memory-profiling --target '${{ matrix.target }}'
      - name: Package binary
        shell: bash
        run: |
          mkdir -p release
          cp 'target/${{ matrix.target }}/release/${{ matrix.binary }}' 'release/${{ matrix.asset }}'
          cp LICENSE THIRD_PARTY_NOTICES.md release/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.asset }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum brazap-* > checksums.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          notes=(--generate-notes)
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag "${notes[@]}" --title "Brazap $RELEASE_TAG" "${flags[@]}"
